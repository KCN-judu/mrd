name: Full verification

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install CP-SAT oracle
        run: python3 -m pip install -r tools/external-oracle/requirements.txt
      - name: Build release verifier
        run: cargo build --release -p rect-cli
      - name: Run quality gates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/logs
          python3 tools/check_biclique_bound.py 2>&1 | tee artifacts/logs/biclique-bound.log
          cargo fmt --all -- --check 2>&1 | tee artifacts/logs/fmt.log
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee artifacts/logs/clippy.log
          cargo test --workspace 2>&1 | tee artifacts/logs/tests.log
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps 2>&1 | tee artifacts/logs/rustdoc.log
      - name: Run full Rust populations
        shell: bash
        run: |
          set -o pipefail
          target/release/rect-cli exhaustive --width 4 --height 4 --output artifacts/exhaustive-4x4.json 2>&1 | tee artifacts/logs/exhaustive-4x4.log
          target/release/rect-cli random --width 8 --height 8 --cases 10000 --seed 42 --output artifacts/random-8x8-seed42.json 2>&1 | tee artifacts/logs/random.log
          target/release/rect-cli polyomino --max-cells 12 --all-solvers --output artifacts/polyomino-max12.json 2>&1 | tee artifacts/logs/polyomino-max12.log
          target/release/rect-cli benchmark --suite adversarial --output artifacts/adversarial.csv 2>&1 | tee artifacts/logs/adversarial.log
          target/release/rect-cli benchmark --suite polyomino --max-cells 10 --output artifacts/polyomino.csv 2>&1 | tee artifacts/logs/polyomino-benchmark.log
          target/release/rect-cli benchmark --suite dense-conflict --sizes 4,8,16,32,64,128 --output artifacts/dense-conflict.csv 2>&1 | tee artifacts/logs/dense-conflict.log
          target/release/rect-cli benchmark --suite clean-boundary-differential --output artifacts/clean-boundary-differential.csv 2>&1 | tee artifacts/logs/clean-boundary-differential.log
          target/release/rect-cli benchmark --suite clean-complete-bipartite-compact --sizes 1,2,4,8,16,32,64,128 --output artifacts/clean-complete-bipartite-compact.csv 2>&1 | tee artifacts/logs/clean-complete-bipartite-compact.log
          target/release/rect-cli benchmark --suite path-tree-comparison --sizes 3 --output artifacts/path-tree-comparison-3x3.csv 2>&1 | tee artifacts/logs/path-tree-comparison-3x3.log
          target/release/rect-cli benchmark --suite path-tree-orientation-audit --sizes 1,2,4,8,16,32,64,128 --output artifacts/path-tree-orientation-audit.csv 2>&1 | tee artifacts/logs/path-tree-orientation-audit.log
          target/release/rect-cli benchmark --suite path-tree-dual-differential --sizes 1,2,4 --output artifacts/path-tree-dual-differential.csv 2>&1 | tee artifacts/logs/path-tree-dual-differential.log
          target/release/rect-cli benchmark --suite path-tree-gap-differential --max-cells 12 --random-cases 100000 --sizes 1,2,4,8,16,32,64,128 --output artifacts/path-tree-gap-differential.csv 2>&1 | tee artifacts/logs/path-tree-gap-differential.log
          target/release/rect-cli benchmark --suite path-tree-scaling --sizes 3,8,16,32,64,128 --output artifacts/path-tree-scaling.csv 2>&1 | tee artifacts/logs/path-tree-scaling.log
          target/release/rect-cli benchmark --suite path-tree-advantage --sizes 1,2,4,8,16,32,64,128 --output artifacts/path-tree-advantage.csv 2>&1 | tee artifacts/logs/path-tree-advantage.log
          target/release/rect-cli benchmark --suite path-tree-vs4d --sizes 1,2,4,8,16,32,64,128,129,513 --output artifacts/path-tree-vs-4d.csv 2>&1 | tee artifacts/logs/path-tree-vs-4d.log
          target/release/rect-cli search-path-tree-witness --max-width 12 --max-height 12 --seed 42 --require-clean --min-horizontal-chords 2 --min-vertical-chords 2 --min-dual-branching 3 --min-path-count 3 --min-heavy-chain-intervals 4 --min-canonical-nodes 2 --output-dir artifacts/path-tree-witnesses 2>&1 | tee artifacts/logs/path-tree-witness-search.log
          cargo test -p rect-verify every_stored_regression_is_replayed 2>&1 | tee artifacts/logs/stored-regressions.log
          target/release/rect-cli benchmark --suite auto-fallback --output artifacts/auto-fallback.csv 2>&1 | tee artifacts/logs/auto-fallback.log
          target/release/rect-cli benchmark --suite polygon-differential --sizes 3 --output artifacts/polygon-differential-3x3.json 2>&1 | tee artifacts/logs/polygon-differential-3x3.log
          target/release/rect-cli benchmark --suite polygon-differential --sizes 4 --output artifacts/polygon-differential-4x4.json 2>&1 | tee artifacts/logs/polygon-differential-4x4.log
          target/release/rect-cli benchmark --suite polygon-negative --output artifacts/polygon-negative.json 2>&1 | tee artifacts/logs/polygon-negative.log
          target/release/rect-cli benchmark --suite polygon-native-fixtures --sizes 1,2,4,8,16 --output artifacts/polygon-native-fixtures.json 2>&1 | tee artifacts/logs/polygon-native-fixtures.log
          target/release/rect-cli benchmark --suite polygon-backend-differential --max-cells 10 --random-cases 1000 --sizes 1,2,4,8 --output artifacts/polygon-backend-differential.json 2>&1 | tee artifacts/logs/polygon-backend-differential.log
          target/release/rect-cli benchmark --suite polygon-scaling --sizes 1,2,4,8,16 --output artifacts/polygon-scaling.csv 2>&1 | tee artifacts/logs/polygon-scaling.log
          python3 tools/check_release_consistency.py 2>&1 | tee artifacts/logs/release-consistency.log
      - name: Run bounded external CP-SAT population
        shell: bash
        run: |
          set -o pipefail
          target/release/rect-cli export-adversarial --output-dir artifacts/adversarial-inputs
          python3 tools/external-oracle/verify_suite.py \
            --rect-cli target/release/rect-cli \
            --exhaustive-width 3 --exhaustive-height 3 \
            --polyomino-max-cells 10 \
            --adversarial-dir artifacts/adversarial-inputs \
            --max-adversarial-grid-cells 20000 \
            --max-component-cells 40 \
            --max-time-seconds 30 \
            --work-dir artifacts/external-work \
            --output artifacts/external-oracle.json 2>&1 | tee artifacts/logs/external-oracle.log
      - name: Generate paper-ready tables
        run: |
          python3 tools/generate_paper_tables.py \
            --manifest artifacts/manifest.json \
            --exhaustive artifacts/exhaustive-4x4.json \
            --random artifacts/random-8x8-seed42.json \
            --adversarial artifacts/adversarial.csv \
            --polyomino artifacts/polyomino.csv \
            --external artifacts/external-oracle.json \
            --dense artifacts/dense-conflict.csv \
            --output-dir artifacts/tables
      - name: Render minimized Rust failures
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/failure-svg
          while IFS= read -r input; do
            name="$(basename "$(dirname "$input")")"
            target/release/rect-cli solve \
              --solver dominance-compressed \
              --input "$input" \
              --output "artifacts/failure-svg/$name.json" \
              --svg "artifacts/failure-svg/$name.svg" || true
          done < <(find test-data/regressions -name input.json -type f 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-verification-evidence
          path: |
            artifacts/
            test-data/regressions/
            test-data/counterexamples/
          if-no-files-found: warn
