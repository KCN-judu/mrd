name: Fast verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python3 tools/check_biclique_bound.py
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run bounded adversarial smoke test
        run: cargo run --release -p rect-cli -- benchmark --suite adversarial --output artifacts/adversarial-smoke.csv
      - name: Run polygon backend smoke campaigns
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p rect-cli -- benchmark --suite polygon-differential --sizes 3 --output artifacts/polygon-differential-3x3.json 2>&1 | tee artifacts/polygon-differential-3x3.log
          cargo run --release -p rect-cli -- benchmark --suite polygon-negative --output artifacts/polygon-negative.json 2>&1 | tee artifacts/polygon-negative.log
          cargo run --release -p rect-cli -- benchmark --suite polygon-native-fixtures --sizes 1,2 --output artifacts/polygon-native-fixtures.json 2>&1 | tee artifacts/polygon-native-fixtures.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-verification-evidence
          path: artifacts/
          if-no-files-found: warn
