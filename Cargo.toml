[workspace]
members = [
    "crates/rect-core",
    "crates/rect-graph",
    "crates/rect-oracle-exact-cover",
    "crates/rect-oracle-sg",
    "crates/rect-dominance",
    "crates/rect-verify",
    "crates/rect-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
