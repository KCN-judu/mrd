[workspace]
members = [
    "crates/mrd-domain",
    "crates/graph",
    "crates/exact-cover-oracle",
    "crates/sg-oracle",
    "crates/dominance",
    "crates/verification",
    "crates/mrd",
]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
